name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Android SDK and Licenses
        run: |
          set +e
          if [ -d "$ANDROID_HOME" ]; then
            sudo chown -R $USER:$USER "$ANDROID_HOME" 2>/dev/null || true
          fi
          mkdir -p "${ANDROID_HOME}/licenses" 2>/dev/null || true
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\n84831b9409646a918e30573bab4c9c91346d8abd\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "${ANDROID_HOME}/licenses/android-sdk-license" 2>/dev/null || true
          set -e

      - name: Restore Keystore and Environment Config
        run: |
          # 1. Restore from base64 if present
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi

          # 2. Guarantee debug.keystore exists with valid credentials
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated new debug.keystore"
          else
            echo "debug.keystore verified"
          fi

          # 3. Create .env if missing
          if [ ! -f ".env" ]; then
            touch .env
          fi

          # 4. Make gradlew executable if present
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Build APK with Gradle
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Prepare APK File for Download
        run: |
          mkdir -p output-apk
          APK_PATH=$(find . -name "*.apk" ! -name "*unaligned*" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" output-apk/Tawheed_App.apk
            echo "APK ready at output-apk/Tawheed_App.apk"
          else
            echo "ERROR: No APK found after build!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tawheed_App_APK
          path: output-apk/Tawheed_App.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          gh release create "v1.0-${{ github.run_number }}" output-apk/Tawheed_App.apk \
            --title "تحميل تطبيق ذكر التوحيد (APK)" \
            --notes "اضغط على Tawheed_App.apk بالأسفل لتثبيت التطبيق على هاتفك." 2>/dev/null || true
